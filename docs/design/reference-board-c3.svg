<text x="630" y="880" font-size="11" fill="#C8CCD0" >Dashed frame: what one screen shows. It is 20 m wide at the near</text>
<text x="630" y="895" font-size="11" fill="#C8CCD0" >edge, 42 m at the far edge and 23 m deep.</text>
<text x="630" y="920" font-size="11" fill="#C8CCD0" >Two 6 m main streets cross at the plaza; the lanes are 3 m.</text>
<text x="630" y="945" font-size="11" fill="#C8CCD0" >Roofs cover about 52% of this drawing. A pitched roof has a lit</text>
<text x="630" y="960" font-size="11" fill="#C8CCD0" >and a shaded side, which tells it from flat ground.</text>
<text x="630" y="985" font-size="11" fill="#C8CCD0" >The red disc in the street at the top is a red warning as the game</text>
<text x="630" y="1000" font-size="11" fill="#C8CCD0" >blends it on cobbles today, between two tile roofs.</text>
<text x="630" y="1025" font-size="11" fill="#C8CCD0" >A main city is about 170 m across: about 4 to 8 screens.</text>
</svg>
