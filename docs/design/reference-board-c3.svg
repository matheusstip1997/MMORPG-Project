<text x="930" y="545" font-size="11" fill="#C8CCD0" >A, in a main street: the 2-floor row on the camera</text>
<text x="930" y="560" font-size="11" fill="#C8CCD0" >side fades. Its roof slopes away at 45 degrees, so</text>
<text x="930" y="575" font-size="11" fill="#C8CCD0" >it hides nothing more than the eaves do.</text>
<text x="930" y="600" font-size="11" fill="#C8CCD0" >B, on the plaza: the 1-floor row is 12 m away and</text>
<text x="930" y="615" font-size="11" fill="#C8CCD0" >4 m to the eaves, so everything stays solid.</text>
<text x="930" y="640" font-size="11" fill="#C8CCD0" >C, on the far bank of an 8 m moat: the wall is</text>
<text x="930" y="655" font-size="11" fill="#C8CCD0" >11 m away and 8 m tall, so it stays solid.</text>
<text x="930" y="680" font-size="11" fill="#C8CCD0" >Character: 1.8 m tall, 0.8 m wide.</text>
