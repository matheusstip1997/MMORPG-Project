<text x="630" y="880" font-size="11" fill="#C8CCD0" >Dashed frame: what one screen shows. It is 20 m wide at the near</text>
<text x="630" y="895" font-size="11" fill="#C8CCD0" >edge, 42 m at the far edge and 23 m deep.</text>
<text x="630" y="920" font-size="11" fill="#C8CCD0" >Canal 6 m, quays 3 m, bridge 5 m, street 6 m, houses 8 m deep.</text>
<text x="630" y="945" font-size="11" fill="#C8CCD0" >Looking along a street, no building stands between the camera</text>
<text x="630" y="960" font-size="11" fill="#C8CCD0" >and the character, so nothing fades. Roofs, paving and water</text>
<text x="630" y="975" font-size="11" fill="#C8CCD0" >fill the picture.</text>
<text x="630" y="1000" font-size="11" fill="#C8CCD0" >Everything sits on the 50 cm grid and faces N, E, S or W</text>
<text x="630" y="1015" font-size="11" fill="#C8CCD0" >(R-11.6-06), so canals run straight and turn at right angles.</text>
<text x="630" y="1040" font-size="11" fill="#C8CCD0" >A main city is about 170 m across: about 4 to 8 screens.</text>
</svg>
