<text x="630" y="880" font-size="11" fill="#C8CCD0" >Dashed frame: what one screen shows. It is 20 m wide at the near</text>
<text x="630" y="895" font-size="11" fill="#C8CCD0" >edge, 42 m at the far edge and 23 m deep.</text>
<text x="630" y="920" font-size="11" fill="#C8CCD0" >Bazaar street 6 m, lanes 3 m, flat roofs with domes.</text>
<text x="630" y="945" font-size="11" fill="#C8CCD0" >Looking along the covered street, the cloth roof lies between the</text>
<text x="630" y="960" font-size="11" fill="#C8CCD0" >camera and the character. It is hidden while the player is under</text>
<text x="630" y="975" font-size="11" fill="#C8CCD0" >it (dashed panels); how much of it hides is part of the open fade.</text>
<text x="630" y="1000" font-size="11" fill="#C8CCD0" >The roofs are most of the picture. Flat clay roofs are close to</text>
<text x="630" y="1015" font-size="11" fill="#C8CCD0" >the street in colour; the pale domes are what stands out.</text>
<text x="630" y="1040" font-size="11" fill="#C8CCD0" >A main city is about 170 m across: about 4 to 8 screens.</text>
</svg>
