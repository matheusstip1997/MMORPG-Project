    <polygon id="b.taiga" fill="#a7c4b5" points="900,400 1100,400 1160,410 1230,450 1210,520 1130,545 1000,560 900,520"/>
    <polygon id="b.cliffs" fill="#b5b8bd" points="1230,450 1440,450 1440,600 1260,600 1210,520"/>
    <polygon id="b.ember" fill="#dc8a6a" points="1130,545 1210,520 1260,600 1440,600 1440,760 1250,760 1170,730 1140,660"/>
    <polygon id="b.ashwoods" fill="#a39a8f" points="1000,560 1130,545 1140,660 1170,730 1080,705 1000,690 930,640 920,590"/>
    <polygon id="b.palms" fill="#8fd3a6" points="900,520 1000,560 920,590 930,640 870,700 840,770 650,780 660,560"/>
    <polygon id="b.marsh" fill="#b2c08f" points="930,640 1000,690 1080,705 1100,760 1050,830 1000,1000 890,1000 900,800 840,770 870,700"/>
    <polygon id="b.springs" fill="#e3c3c0" points="1080,705 1170,730 1250,760 1440,760 1440,1000 1000,1000 1050,830 1100,760"/>
    <polygon id="b.jungle" fill="#4f9e63" points="650,780 840,770 900,800 890,1000 640,1000"/>
  </g>
  <!-- The island: the small desert -->
  <path id="b.duneisle" d="M520,688 C580,680 620,690 625,730 C625,790 590,850 530,855 C505,853 465,843 430,836 C405,832 390,810 415,803 C445,796 485,800 490,780 C500,740 510,700 520,688 Z" fill="#f3e2ae"/>
