  <!-- Tutorial pockets: one gated starter area next to each start city (R-6.5-01, R-12.3-01) -->
  <g fill="#ffffff" fill-opacity="0.45" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5 4">
    <circle cx="195" cy="190" r="26"/><circle cx="155" cy="755" r="26"/><circle cx="1010" cy="822" r="26"/>
  </g>

  <!-- Settlements: main (red), medium (yellow), small (blue); M6 is the lawless city -->
  <g fill="#c9443f" stroke="#6e1b18" stroke-width="2.5">
    <circle cx="295" cy="120" r="34"/><circle cx="237" cy="720" r="34"/><circle cx="955" cy="748" r="34"/>
  </g>
  <!-- Raid gates (R-6.7-02 raidStart) in the three main cities -->
  <g fill="#ffffff" stroke="#6e1b18" stroke-width="1">
    <polygon transform="translate(295,120)" points="0,-13 3.8,-4.3 12.4,-4 6.1,2.2 7.7,10.5 0,6 -7.7,10.5 -6.1,2.2 -12.4,-4 -3.8,-4.3"/>
    <polygon transform="translate(237,720)" points="0,-13 3.8,-4.3 12.4,-4 6.1,2.2 7.7,10.5 0,6 -7.7,10.5 -6.1,2.2 -12.4,-4 -3.8,-4.3"/>
    <polygon transform="translate(955,748)" points="0,-13 3.8,-4.3 12.4,-4 6.1,2.2 7.7,10.5 0,6 -7.7,10.5 -6.1,2.2 -12.4,-4 -3.8,-4.3"/>
  </g>
  <circle cx="1205" cy="647" r="30" fill="none" stroke="#b3261e" stroke-width="3" stroke-dasharray="8 5"/>  <g fill="#e8b923" stroke="#7c5d06" stroke-width="2">
