    <polyline points="1100,462 1150,440 1185,420 1185,330 1212,308"/>
    <polyline points="1185,420 1240,460 1270,520 1285,570 1270,610 1205,647"/>
    <polyline points="1100,462 1110,530 1130,560 1100,590 1055,607"/>
    <polyline points="1100,590 1150,600 1190,615 1205,647"/>
