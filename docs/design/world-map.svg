    <circle cx="557" cy="745" r="18"/><circle cx="1100" cy="462" r="18"/>
    <circle cx="1205" cy="647" r="18" fill="#2b2b2b" stroke="#b3261e" stroke-width="4"/>
  </g>
  <g fill="#3f6fb5" stroke="#1b3768" stroke-width="2">
    <circle cx="320" cy="282" r="9"/><circle cx="604" cy="357" r="9"/><circle cx="517" cy="468" r="9"/><circle cx="357" cy="629" r="9"/>
    <circle cx="287" cy="836" r="9"/><circle cx="544" cy="812" r="9"/><circle cx="1212" cy="308" r="9"/><circle cx="1270" cy="520" r="9"/>
    <circle cx="1055" cy="607" r="9"/><circle cx="737" cy="713" r="9"/><circle cx="845" cy="858" r="9"/>
  </g>
