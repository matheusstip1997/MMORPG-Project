  <text x="1342" y="115" font-size="14" fill="#444444" text-anchor="middle">field 1 (dev world)</text>
  <text x="1342" y="134" font-size="14" fill="#444444" text-anchor="middle">400 x 400 m</text>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#333333">N ↑</text>

  <!-- Legend -->
  <g font-size="16" fill="#222222">
    <line x1="40" y1="1030" x2="440" y2="1030" stroke="#222222" stroke-width="3"/>
    <line x1="40" y1="1022" x2="40" y2="1038" stroke="#222222" stroke-width="3"/>
    <line x1="240" y1="1022" x2="240" y2="1038" stroke="#222222" stroke-width="3"/>
    <line x1="440" y1="1022" x2="440" y2="1038" stroke="#222222" stroke-width="3"/>
