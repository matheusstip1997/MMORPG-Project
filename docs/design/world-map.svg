    <polygon id="b.heather" fill="#cdb9d8" points="420,0 680,0 690,200 660,290 540,305 415,300 400,235 420,150"/>
    <polygon id="b.rime" fill="#eef4f8" points="680,0 900,0 900,520 720,520 700,430 690,330 660,290 690,200"/>
    <polygon id="b.lakes" fill="#a9cfe0" points="415,300 540,305 660,290 690,330 700,430 600,440 480,430 400,380"/>
    <polygon id="b.oldforest" fill="#7fb877" points="0,370 260,395 400,380 400,560 250,575 0,560"/>
    <polygon id="b.fungal" fill="#9c8fb5" points="400,380 480,430 600,440 700,430 720,520 900,520 660,560 560,570 400,560"/>
    <polygon id="b.steppe" fill="#dcd59a" points="0,560 250,575 400,560 560,570 660,560 655,670 420,680 300,665 120,655 0,650"/>
    <polygon id="b.redsands" fill="#ecc489" points="0,650 120,655 300,665 420,680 655,670 650,780 400,790 250,785 0,790"/>
    <polygon id="b.canyons" fill="#c98f6d" points="0,790 250,785 400,790 650,780 640,1000 0,1000"/>
