    <circle cx="560" cy="1124" r="9" fill="#2b2b2b" stroke="#b3261e" stroke-width="3"/><text x="580" y="1130">lawless city</text>
    <line x1="860" y1="1028" x2="900" y2="1028" stroke="#d9668a" stroke-width="4"/><text x="910" y="1034">main road</text>
    <line x1="860" y1="1060" x2="900" y2="1060" stroke="#7a5a3a" stroke-width="12"/><text x="910" y="1066">bridge over the sea</text>
    <polygon points="868,1100 880,1080 892,1100" fill="#8c2f1c"/><text x="910" y="1098">volcano</text>
    <circle cx="1140" cy="1028" r="12" fill="#ffffff" fill-opacity="0.45" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5 4"/><text x="1162" y="1034">tutorial pocket (to lv 10)</text>
    <polygon transform="translate(1140,1060)" points="0,-13 3.8,-4.3 12.4,-4 6.1,2.2 7.7,10.5 0,6 -7.7,10.5 -6.1,2.2 -12.4,-4 -3.8,-4.3" fill="#c9443f" stroke="#6e1b18" stroke-width="1"/><text x="1162" y="1066">raid gate (raidStart)</text>
    <text x="1130" y="1100" font-size="14">v5: 20 biomes, bridges 130-150 m;</text>
    <text x="1130" y="1120" font-size="14">no dungeons or territories yet;</text>
    <text x="1130" y="1140" font-size="14">monsters by rank; names placeholders</text>
  </g>
</svg>
