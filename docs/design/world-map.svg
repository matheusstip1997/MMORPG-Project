    <use href="#b.oldforest"/><use href="#b.fungal"/><use href="#b.steppe"/><use href="#b.redsands"/><use href="#b.canyons"/>
    <use href="#b.frostpeaks"/><use href="#b.taiga"/><use href="#b.cliffs"/><use href="#b.ember"/><use href="#b.ashwoods"/>
    <use href="#b.palms"/><use href="#b.marsh"/><use href="#b.springs"/><use href="#b.jungle"/>
  </g>
  <!-- The lake of the Lake country (unwalkable water) -->
  <ellipse cx="500" cy="378" rx="38" ry="22" fill="#d4e6f3" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- Coastlines -->
  <g fill="none" stroke="#2b2b2b" stroke-width="2.5">
    <path d="M305,88 C360,90 400,105 430,112 C520,125 650,150 760,200 C830,240 855,300 855,380 C855,430 830,460 760,490 C680,520 600,530 580,550 C520,600 450,670 400,740 C350,820 300,880 250,900 C180,910 110,895 95,840 C85,780 110,650 130,500 C130,380 120,300 130,250 C150,170 220,110 305,88 Z"/>
    <path d="M1185,235 C1240,240 1270,280 1280,350 C1290,400 1330,440 1325,500 C1310,600 1270,700 1220,770 C1160,840 1080,890 900,898 C780,900 740,880 720,840 C690,780 670,730 700,690 C760,640 830,610 890,560 C925,530 895,470 903,425 C912,375 950,320 1010,290 C1070,258 1130,238 1185,235 Z"/>
    <path d="M520,688 C580,680 620,690 625,730 C625,790 590,850 530,855 C505,853 465,843 430,836 C405,832 390,810 415,803 C445,796 485,800 490,780 C500,740 510,700 520,688 Z"/>
  </g>

  <!-- Landmarks: the volcano of the Ember caldera, peaks, dunes -->
  <polygon points="1205,725 1230,685 1255,725" fill="#8c2f1c" stroke="#4a160b" stroke-width="2"/>
  <g fill="#ffffff" stroke="#7d93a3" stroke-width="2">
    <polygon points="1120,380 1140,348 1160,380"/><polygon points="1238,442 1256,412 1274,442"/>
    <polygon points="740,300 756,274 772,300"/>
  </g>

