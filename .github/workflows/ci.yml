name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Persistence integration tests create and drop their own mmorpg_test_* databases (spec 11.3).
    # CI-only throwaway credentials, the same dev values as docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmorpg
          POSTGRES_PASSWORD: mmorpg_dev
          POSTGRES_DB: mmorpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmorpg -d mmorpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Session integration tests (ownership locks, ticket nonces) use their own key prefix (spec 2.1, 2.5).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MMORPG_TEST_PG: Host=127.0.0.1;Port=5432;Username=mmorpg;Password=mmorpg_dev;Database=postgres
      MMORPG_TEST_REDIS: 127.0.0.1:6379

    steps:
      # LFS files (art, PDFs) are not needed to build; skipping them saves LFS bandwidth.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mmorpg.sln

      - name: Build
        run: dotnet build Mmorpg.sln --no-restore --configuration Release

      # The concurrency suite of the M4 exit (no duplication; docs/plans/m4-player-economy-plan.md section 1, WP-M4-12) runs
      # as its own step below, so it is excluded here: [Trait("Category", "NoDuplication")], tests/GameServer.Tests/TestCategories.cs.
      - name: Test
        run: dotnet test Mmorpg.sln --no-build --configuration Release --filter "Category!=NoDuplication" --logger "trx" --results-directory TestResults

      # Every push: two buyers on one listing, a trade confirmed while an item moves, a mail claimed twice, a crash between
      # escrow and settlement...; after each, items and gold are conserved. WP-M4-4 writes the first tests; empty, it passes.
      - name: No duplication (concurrency suite)
        run: dotnet test Mmorpg.sln --no-build --configuration Release --filter "Category=NoDuplication" --logger "trx" --results-directory TestResults/no-duplication

      - name: Validate config tables
        run: dotnet run --project src/Tools/DataValidator --no-build --configuration Release -- --data data/tables --report TestResults/data-validation.json

      # Spec 12.5 (WP-M2-12): the economy simulator's structural checks over the economy tables (about a second).
      - name: Economy simulator check
        run: dotnet run --project src/Tools/EconomySimulator --no-build --configuration Release -- --check --report TestResults/economy-simulation.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # Bot smoke load test (backlog J, spec 11.5): 20 BotClient bots against the GameServer and the Auth API (dev login),
  # with the tick p99 from the server's telemetry. 2 minutes on pushes and pull requests, the 5 minutes of spec 11.5 on
  # pushes to main (user decision 2026-10-26). Runs in parallel with build-and-test.
  bot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The same throwaway dev credentials as build-and-test and docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmorpg
          POSTGRES_PASSWORD: mmorpg_dev
          POSTGRES_DB: mmorpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmorpg -d mmorpg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Debug: the Auth API's dev login is compiled only into Debug builds (src/AuthApi/DevLogin.props).
      - name: Build servers and tools
        run: |
          dotnet build src/GameServer --configuration Debug
          dotnet build src/AuthApi --configuration Debug
          dotnet build src/Tools/DbMigrate --configuration Debug
          dotnet build src/Tools/BotClient --configuration Debug

      - name: Migrate the databases
        run: dotnet run --project src/Tools/DbMigrate --no-build --configuration Debug -- --dev

      - name: Bot load test
        run: >-
          dotnet artifacts/bin/BotClient/debug/BotClient.dll loadtest
          --scenario ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-merge' || 'ci-smoke' }}
          --run-dir artifacts/load/ci

      # Bots in pairs (WP-M4-12, spec 11.5): two bots meet, play the pair steps ("not yet" until their M4 WPs land, so the
      # job stays green), kill a monster each and meet again; no step may fail or time out (BotScenario.requireNoFailedSteps).
      - name: Bot pair check
        run: >-
          dotnet artifacts/bin/BotClient/debug/BotClient.dll loadtest
          --scenario ci-pair
          --run-dir artifacts/load/ci-pair

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-smoke
          path: |
            artifacts/load/ci
            artifacts/load/ci-pair

  # The dev environment in one command (backlog A, spec 11.3) and admin panel v0 (backlog J, spec 7.4): builds the dev
  # images, starts the whole stack with `docker compose up -d --wait` (generated dev secrets, no .env), and runs
  # tools/compose/Test-ComposeStack.ps1 against it. The dev login end to end goes through the BotClient, which runs the
  # Unity client's own Auth API and connection code (src/Tools/ClientCore); the Unity LoginEndToEndTests need a Unity
  # license and run locally against the same stack. Then the admin panel finds a bot's character, kicks it (double
  # submit, one audit row) and reads its telemetry and the game server log. Runs in parallel with the other jobs.
  compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the dev images
        run: docker compose build

      - name: Start the whole stack (one command)
        run: docker compose up -d --wait --wait-timeout 300

      # Debug: the dev login exists only in Debug builds, and the BotClient plays through it.
      - name: Build the BotClient
        run: dotnet build src/Tools/BotClient --configuration Debug

      - name: Login end to end and admin panel smoke test
        shell: pwsh
        run: ./tools/compose/Test-ComposeStack.ps1

      - name: Collect the service logs
        if: failure()
        run: |
          mkdir -p artifacts/compose
          docker compose ps -a > artifacts/compose/ps.txt
          docker compose logs --no-color > artifacts/compose/logs.txt

      - name: Upload the service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-stack
          path: artifacts/compose

      - name: Stop the stack
        if: always()
        run: docker compose down -v
